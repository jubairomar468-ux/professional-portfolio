<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jubair Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Unbounded:wght@300;500&display=swap">
<style>
:root{
  /* Concept: a radial index of six nodes over a drifting constellation. Each node opens a list, each entry opens highlights, each highlight opens its evidence. */
  --ink:#070a0f;--ink-glass:rgba(7,10,15,.86);--panel:#0e141c;--panel-hi:#141d28;
  --line:rgba(140,180,220,.16);--line-hi:rgba(111,211,255,.5);
  --text:#e8eef6;--muted:#8e9db0;--accent:#6fd3ff;--accent-dim:rgba(111,211,255,.1);--amber:#ffb86b;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bar:52px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{margin:0;font:400 15px/1.6 var(--f-body);color:var(--text);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.shell{position:relative;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:18px;height:var(--bar)}
.brand{display:flex;align-items:center;gap:10px;font:500 12px var(--f-display);letter-spacing:.14em;flex:none}
.brand i{width:9px;height:9px;background:var(--accent);display:block}
#crumbs{flex:1;min-width:0;display:flex;gap:8px;align-items:center;font:400 12px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden}
#crumbs span{overflow:hidden;text-overflow:ellipsis;color:var(--text)}
#crumbs button{color:var(--muted);flex:none}
#crumbs button:hover{color:var(--accent)}
#crumbs i{font-style:normal;flex:none}
.chip{flex:none;font:400 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,184,107,.4);padding:3px 8px;border-radius:2px}

.view{animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);font-size:17px;line-height:1.6;max-width:42ch}
.label{font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:center;padding-block:48px 24px}
.home h1{font:300 clamp(2.1rem,5.4vw,3.7rem)/1.1 var(--f-display);letter-spacing:-.025em;margin:14px 0 20px;text-wrap:balance}
.contact{display:flex;align-items:flex-start;gap:10px 14px;flex-wrap:wrap;margin-top:16px;font:400 12px var(--f-mono)}
.contact-items{display:flex;align-items:center;gap:7px 14px;flex-wrap:wrap;min-width:0}
.contact-location{color:var(--muted);white-space:nowrap}
.contact-items a{color:var(--text);text-decoration:none;word-break:break-word;transition:color .2s}
.contact-items a:hover{color:var(--accent)}
.contact .addr{color:var(--text);word-break:break-all}
.copy{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line-hi);padding:5px 10px;border-radius:2px;flex:none}
.copy:hover{border-color:var(--accent);background:var(--accent-dim)}
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap}
.foot .contact{margin-top:0}
.hint{display:flex;align-items:center;gap:8px;margin-top:28px;font:400 12px var(--f-mono);color:var(--muted)}
.orbit-wrap{padding-bottom:44px}
.orbit{position:relative;width:min(100%,540px);aspect-ratio:1;margin-inline:auto}
.orbit svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{transform-origin:50px 50px;animation:spin 120s linear infinite}
.ring.rev{animation-direction:reverse;animation-duration:80s}
@keyframes spin{to{transform:rotate(360deg)}}
.r1{fill:none;stroke:var(--line);stroke-width:.3;stroke-dasharray:.3 1.3}
.r2{fill:none;stroke:var(--line);stroke-width:.25}
.r3{fill:none;stroke:var(--line);stroke-width:.3;stroke-dasharray:2 3}
.sat{fill:var(--accent)}
.spoke{stroke:var(--line-hi);stroke-width:.25;stroke-dasharray:1 1.6;animation:flow 7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-5.2}}
.core{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--panel);border:1px solid var(--line-hi);display:grid;place-content:center;text-align:center;font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.core small{display:block;font:400 10px var(--f-mono);color:var(--muted);letter-spacing:.08em;margin-top:2px}
.core::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--accent);animation:pulse 3.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.55}to{transform:scale(1.55);opacity:0}}
.node{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:6px;width:112px;text-align:center}
.node .dot{width:56px;height:56px;border-radius:50%;background:var(--panel);border:1px solid var(--line-hi);display:grid;place-items:center;color:var(--accent);transition:transform .2s,background .2s,border-color .2s}
.node:hover .dot,.node:focus-visible .dot{transform:scale(1.12);background:#13202c;border-color:var(--accent)}
.node b{font:500 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.node small{font:400 11px var(--f-mono);color:var(--muted)}

.rail{display:flex;gap:6px;overflow-x:auto;padding-block:24px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rb{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:2px;font:400 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:rgba(14,20,28,.7);transition:border-color .2s,color .2s}
.rb:hover{border-color:var(--line-hi);color:var(--text)}
.rb[aria-current]{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}

.head{padding-top:28px}
.head h2{font:300 clamp(1.9rem,4.6vw,3.1rem)/1.1 var(--f-display);letter-spacing:-.02em;margin:10px 0 14px;text-wrap:balance}
.rows{margin-top:32px;border-top:1px solid var(--line);padding-bottom:64px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px 24px;width:100%;padding:22px 12px;border-bottom:1px solid var(--line);align-items:start;transition:background .2s}
.row:hover{background:rgba(14,20,28,.85)}
.row .when{font:400 12px var(--f-mono);color:var(--muted);padding-top:5px}
.row .t{display:block;font:500 19px/1.3 var(--f-body)}
.row .sub{display:block;color:var(--muted);margin-top:2px}
.row .sum{display:block;margin-top:10px;max-width:62ch;color:#c4cfdb}
.row .tags{margin-top:12px}
.row .go{display:flex;align-items:center;gap:8px;font:400 12px var(--f-mono);color:var(--accent);padding-top:5px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:400 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:2px}
.role-skills{margin-top:13px}
.role-skills-label{display:block;font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.role-skills .tags{margin-top:7px}
.role-skills .tags span{color:#c8eefe;border-color:rgba(111,211,255,.28);background:rgba(111,211,255,.06)}
.summary-label{display:block;margin-top:18px;font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.info .summary-label+.sum{margin-top:6px}
.course-explorer{margin-top:26px;border:1px solid var(--line);border-radius:2px;background:rgba(14,20,28,.7)}
.course-explorer>summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 16px;cursor:pointer;list-style:none}
.course-explorer>summary::-webkit-details-marker,.course-card>summary::-webkit-details-marker{display:none}
.course-explorer>summary::after{content:'+';font:500 20px var(--f-mono);color:var(--accent)}
.course-explorer[open]>summary::after{content:'−'}
.course-explorer-title{display:block;font:500 14px var(--f-body)}
.course-explorer-note{display:block;margin-top:2px;font:400 11px var(--f-mono);color:var(--muted)}
.course-list{display:grid;gap:8px;padding:0 10px 10px;border-top:1px solid var(--line)}
.course-card{border:1px solid var(--line);border-radius:2px;background:var(--panel);overflow:hidden}
.course-card:first-child{margin-top:10px}
.course-card>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px;cursor:pointer;list-style:none}
.course-card>summary:hover{background:var(--accent-dim)}
.course-code{display:block;font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.course-title{display:block;margin-top:2px;font-weight:500;line-height:1.35}
.course-grade{align-self:center;font:500 10px/1.4 var(--f-mono);color:var(--amber);text-align:right;white-space:nowrap}
.course-body{display:grid;gap:13px;padding:13px 12px 15px;border-top:1px solid var(--line);background:#0a1017}
.course-field span{display:block;font:500 9px var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.course-field p{margin-top:4px;color:#c4cfdb;font-size:13px;line-height:1.55}
.course-status{padding:9px 10px;border-left:2px solid var(--amber);background:rgba(255,184,107,.06)}
.work-explorer{margin-top:26px;border:1px solid var(--line);border-radius:2px;background:rgba(14,20,28,.7)}
.work-explorer-head{padding:15px 16px;border-bottom:1px solid var(--line)}
.work-explorer-title{display:block;font:500 14px var(--f-body)}
.work-explorer-note{display:block;margin-top:2px;font:400 11px var(--f-mono);color:var(--muted)}
.work-list{display:grid;gap:8px;padding:10px}
.work-card{border:1px solid var(--line);border-radius:2px;background:var(--panel);overflow:hidden}
.work-card>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:13px;cursor:pointer;list-style:none}
.work-card>summary::-webkit-details-marker{display:none}
.work-card>summary:hover{background:var(--accent-dim)}
.work-card>summary::after{content:'+';align-self:center;font:500 18px var(--f-mono);color:var(--accent)}
.work-card[open]>summary::after{content:'−'}
.work-level{display:block;font:500 9px var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.work-title{display:block;margin-top:3px;font-weight:500;line-height:1.35}
.work-sub{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.work-body{display:grid;gap:14px;padding:14px;border-top:1px solid var(--line);background:#0a1017}
.work-overview{color:#c4cfdb;font-size:13px;line-height:1.6}
.work-field span{display:block;font:500 9px var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.work-field p{margin-top:4px;color:#c4cfdb;font-size:13px;line-height:1.55}
.work-tools .tags{margin-top:7px}
.work-evidence{display:flex;flex-wrap:wrap;gap:8px}
.work-evidence a{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line-hi);border-radius:2px;color:var(--accent);font:500 10px var(--f-mono);letter-spacing:.04em;text-decoration:none}
.work-evidence a:hover{border-color:var(--accent);background:var(--accent-dim)}

.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;padding-block:24px 72px;align-items:start}
.back{display:inline-flex;align-items:center;gap:8px;font:400 12px var(--f-mono);color:var(--muted);margin-bottom:22px}
.back:hover{color:var(--accent)}
.info h2{font:300 clamp(1.6rem,3.6vw,2.5rem)/1.15 var(--f-display);letter-spacing:-.02em;margin:10px 0 8px;text-wrap:balance}
.info .sub{color:var(--muted)}
.info .sum{margin:16px 0 14px;color:#c4cfdb;max-width:56ch}
.info .label{margin:32px 0 12px}
.hls{display:grid;gap:8px}
.hl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:2px;background:rgba(14,20,28,.7);transition:border-color .2s,background .2s}
.hl:hover{border-color:var(--line-hi)}
.hl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.hl-t{font-weight:500}
.hl-m{font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.hud{position:relative;border:1px solid var(--line);background:rgba(14,20,28,.92)}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent);pointer-events:none}
.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hud::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.panel{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px) + 16px)}
.pin{padding:22px;animation:rise .2s ease}
.pin h3{font:500 20px/1.3 var(--f-body);margin:8px 0 10px}
.pin .more{color:#c4cfdb;max-width:58ch}
.pin .more a{color:var(--accent);text-underline-offset:.18em}
.pin .label{margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{display:block;border:1px solid var(--line);background:var(--panel-hi);transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{display:grid;place-items:center;aspect-ratio:16/10;color:var(--accent);border-bottom:1px solid var(--line);background-color:#0a1017;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.thumb:has(img){position:relative;background:#0a1017}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tb{display:block;padding:10px 12px 12px}
.ty{display:block;font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.tt{display:block;font-weight:500;font-size:14px;margin-top:4px}
.tc{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.foot{padding-block:28px 36px;border-top:1px solid var(--line);font:400 12px var(--f-mono);color:var(--muted)}

.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(4,6,9,.9);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-card{width:min(860px,100%);max-height:100%;overflow:auto;padding:18px;background:var(--panel)}
.lb-card::before{top:0;left:0}.lb-card::after{right:0;bottom:0}
.lb-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.lb-top .count{font:400 12px var(--f-mono);color:var(--muted);flex:1}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:2px;color:var(--text);flex:none}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.lb-cap{margin-top:16px}
.lb-cap h3{font:500 20px/1.3 var(--f-body)}
.lb-cap p{color:var(--muted);margin-top:4px}
.lb-nav{display:flex;gap:8px;margin-top:16px}
.media{position:relative;aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);overflow:hidden;background-color:#0a1017;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
.ph{position:absolute;top:10px;left:12px;font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.play{width:68px;height:68px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-dim);display:grid;place-items:center;color:var(--accent)}
.track{position:absolute;left:12px;right:12px;bottom:34px;height:3px;background:var(--line)}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.tm{position:absolute;left:12px;bottom:10px;font:400 11px var(--f-mono);color:var(--muted)}
.sheet{width:34%;max-width:230px;aspect-ratio:3/4;padding:12%;background:var(--panel-hi);border:1px solid var(--line-hi)}
.sheet i{display:block;height:100%;background:repeating-linear-gradient(to bottom,transparent 0 12px,var(--line-hi) 12px 13px)}
.private-doc{width:40%;max-width:250px;display:grid;justify-items:center;gap:4px}
.private-doc .sheet{width:100%;max-width:none}
.access-note{display:block;margin-top:9px;max-width:280px;font:400 11px/1.5 var(--f-mono);color:var(--muted);text-align:center}
.open{display:inline-block;margin-top:12px;font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;border-radius:2px;text-decoration:none}
.lb-card:has(.photo-media){width:min(1240px,100%)}
.photo-media{aspect-ratio:auto;background-color:#080d13;background-image:none}
.photo-media img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.public-doc-media{aspect-ratio:auto;height:min(72vh,760px);display:block;overflow:auto;padding:0 14px 16px;background-color:#111821;background-image:none}
.public-doc-media .ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px 14px;padding:10px 14px;background:rgba(10,16,23,.96);border-bottom:1px solid var(--line)}
.public-doc-media .ph .open{margin:0;padding:4px 9px;white-space:nowrap}
.public-doc-pages{display:grid;gap:16px;max-width:980px;margin:0 auto}
.public-doc-pages img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line-hi);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.url{max-width:84%;padding:14px 18px;border:1px solid var(--line-hi);background:var(--panel);font:400 15px var(--f-mono);color:var(--text);word-break:break-all;text-align:center}

@media(max-width:900px){
  .home{grid-template-columns:minmax(0,1fr);gap:24px;padding-top:32px}
  .detail{grid-template-columns:minmax(0,1fr);gap:28px}
  .panel{position:static}
}
@media(max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .when{grid-column:1/-1;padding:0}
  .chip{display:none}
  .pin{padding:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 {id:'research1',title:'Pulsed electromagnetic field research',sub:'Research Assistant · Dr. Zaid Bin Mahbub, North South University',when:'May 2024 to Sep 2026',sum:'I studied how peripheral pulse shape varied during pulsed electromagnetic field (PEMF) exposure. I analysed optical pulse recordings in Python and used MATLAB and COMSOL Multiphysics to model the coil field and arterial flow.',tags:['PEMF','Peripheral circulation','PPG & Doppler'],skills:['Biomedical Signal Processing','Python','MATLAB','COMSOL Multiphysics','Waveform Fitting','Finite-Element Modelling','Data Acquisition'],hl:[
  H('Supervisor recommendation','Dr. Zaid Bin Mahbub, who supervised me closely as a Research Assistant for about two years, ranks me among the top 5% of students he has supervised. His letter describes my Python and MATLAB signal-processing pipelines, COMSOL electromagnetic and multiphysics simulations, and Raspberry Pi sensor and data-acquisition work within funded PEMF research. He also notes that I translate governing equations into computational models and evaluate simulation results critically rather than relying on software alone.',[E('doc','Research supervisor recommendation','Public recommendation from Dr. Zaid Bin Mahbub · ranks me among the top 5% of students he has supervised',DOCS.zaidRecommendation)]),
  H('Recorded pulses with and without PEMF','I compared fingertip photoplethysmography (PPG) recordings from the two conditions, fitting individual beats as well as their pooled average. Across more than 1,000 beats per condition in this pilot analysis, the fitted diastolic component was smaller and peaked later under exposure. Keeping the individual fits showed how much variation the average concealed. <a href="#projects4">Explore the PPG Distribution Optimizer</a>.',[E('photo','Recorded PPG pulses with and without exposure','Python · The blue and red curves show each condition’s mean pulse. Shading spans one standard deviation across beats.',IMAGE_ASSETS.ppgMeanBands)]),
  H('Radial-artery exposure model in MATLAB','I modelled the coil current during a pulse and estimated how the magnetic and induced electric fields varied with depth. I then varied vessel radius and blood velocity with simulated exposure time to calculate flow, pressure drop and wall shear stress. I compared exponential and logistic fits across 20 synthetic subjects over 1 to 10,000 simulated minutes.',[E('photo','Simulated flow and shear across exposure durations','MATLAB · Each cell is a model output relative to its zero-minute baseline. Flow, wall shear stress (WSS) and pressure drop (ΔP) occupy separate rows.',IMAGE_ASSETS.matlabExposureMap),E('photo','Modelled coil fields with depth','MATLAB · Estimated on-axis magnetic field and induced electric field over 30 mm, with reference depths for skin, fat and muscle.',IMAGE_ASSETS.matlabFieldDepth)]),
  H('Coil coupling and branching arteries in COMSOL','I worked on two three-dimensional finite-element models. In an idealised coil and vessel geometry, I coupled the magnetic field to laminar flow through a Lorentz body force. In a separate geometry, I meshed the brachial artery where it divides into the radial and ulnar branches and used a Newtonian fluid to establish baseline flow. A matched coil-on and coil-off comparison with Doppler measurements was the planned validation step.',[E('photo','Coil and vessel geometry in COMSOL','COMSOL Multiphysics · The geometry and fluid-equation settings for the idealised electromagnetic and laminar-flow model.',IMAGE_ASSETS.comsolCoilFlow),E('photo','Brachial artery bifurcation in COMSOL','COMSOL Multiphysics · Geometry used to study baseline flow at the split into the radial and ulnar arteries.',IMAGE_ASSETS.comsolBifurcation)]),
  H('Checking the flow assumptions','I used Reynolds and Womersley numbers to examine the flow regime, tested shear-dependent viscosity with the Carreau–Yasuda model and estimated heating from induced currents. Wall shear stress already exceeded the chosen reference band at baseline in the MATLAB model. That made vessel radius and velocity priorities for calibration against Doppler measurements.',[]),
  H('Measurement and visualisation','The team used Doppler ultrasound and optical pulse measurements to study peripheral circulation. I helped interface sensors to a Raspberry Pi 5 for live acquisition and signal processing. My simulation work also involved three-dimensional visualisation in Python with PyVista, VTK and Plotly. <a href="#projects1">View the monitoring prototype</a>.',[E('doc','Research supervisor recommendation','Confirms sensor interfacing, data acquisition and real-time signal processing on Raspberry Pi platforms',DOCS.zaidRecommendation)])]},

  H('CPS Lab research and academic recommendation','Dr. A.S.M. Jahid Hasan confirms my active research volunteering at the NSU Cyber-Physical Systems (CPS) Lab and highlights my learning ability, dedication to research and work ethic. He also records A grades in EEE362 Power Systems and EEE552 Smart Energy Systems. The letter supports my lab affiliation and academic preparation; the specific 94-bus and stability-study details are described in the project entries.',[E('doc','GTA recommendation letter','Public recommendation from Dr. A.S.M. Jahid Hasan · confirms CPS Lab volunteering and power-systems coursework',DOCS.gtaRecommendation)])]},
 {id:'research3',title:'Conduction velocity and motor unit prediction',sub:'Biomedical Physics & Engineering Express · IOP Publishing',when:'Published 28 Jul 2026',sum:'Co-authored peer-reviewed research combining biomedical signal processing, inverse modelling and metaheuristic optimisation to estimate conduction velocity distribution and motor unit action potential characteristics from evoked compound muscle action potential recordings.',tags:['Published','Peer reviewed','CMAP & MUAP','Metaheuristics'],skills:['MATLAB','Python','Biomedical Signal Processing','CMAP Signal Analysis','MUAP Modelling','Conduction Velocity Analysis','Inverse Problem Modelling','Mathematical Modelling','Metaheuristic Optimisation','Genetic Algorithms','Grey Wolf Optimizer','Nonlinear Least Squares','Parameter Estimation','Hermite Polynomial Modelling','Weibull Distribution Modelling','Synthetic & In-vivo Data Analysis','Noise Robustness & SNR Testing','Convergence Analysis','Model Validation','Scientific Data Visualisation'],hl:[
  H('Publication','Prediction of Conduction Velocity Distribution and Motor Unit Action Potential from Evoked Compound Muscle Action Potential: A Novel Metaheuristic-Based Framework. Biomedical Physics & Engineering Express, Vol. 12, Article 045044, published 28 July 2026.',[E('link','Published article','DOI: 10.1088/2057-1976/ae8af8','https://doi.org/10.1088/2057-1976/ae8af8'),E('doc','Paper PDF','Add the PDF')]),
  H('Inverse modelling framework','The study simultaneously estimated MUAP waveform characteristics and motor nerve CVD from recorded CMAP signals. MUAP was represented with a modified piecewise Hermite polynomial formulation and CVD with a modified single Weibull distribution.',[E('link','Study abstract','View the method summary','https://doi.org/10.1088/2057-1976/ae8af8')]),
  H('Optimisation methods','Mean squared error between recorded and reconstructed CMAP signals was minimised using genetic algorithm and grey wolf optimizer approaches, with gradient-based nonlinear least squares used as a comparison baseline.',[E('doc','Optimisation notes','Add a shareable method summary')]),
  H('Validation and analysis','The framework was evaluated with synthetic and in-vivo CMAP datasets, convergence analysis, signal-to-noise-ratio robustness testing and group-level comparison of non-neuropathic and diabetic-neuropathy subgroups.',[E('photo','Reconstruction or convergence plot','Add a shareable result figure')]),
  H('Tools used','MATLAB and Python were used for scientific programming, signal processing, numerical modelling, optimisation, parameter estimation, model evaluation and data visualisation.',[E('photo','MATLAB or Python workflow','Add a code, model or result image')]),
  H('Journal standing','Indexed in Scopus (Q3) and Web of Science (ESCI), with an impact factor of 1.77.',[E('photo','Journal listing','Add a screenshot of the journal page')])]},

 {id:'research5',title:'PEMF-driven peripheral arterial hemodynamics',sub:'Biomedical Physics & Engineering Express · IOP Publishing',when:'Published 22 Oct 2026',sum:'Third-author, peer-reviewed study of acute orientation-dependent peripheral arterial waveform responses to pulsed electromagnetic fields, integrating Doppler ultrasound and photoplethysmography.',tags:['Published','Peer reviewed','PEMF','Doppler & PPG'],skills:['Data Curation','Formal Analysis','Research Methodology','Validation','Biomedical Signal Analysis','Photoplethysmography (PPG)','Doppler Ultrasound','Hemodynamic Analysis','Nonparametric Statistics','Scientific Collaboration'],hl:[
  H('Publication','Kiser, A., Islam, M. T., Hamza, J. I. O., et al. (2026). Pulsed electromagnetic field driven perturbation of peripheral arterial hemodynamics: integrated evidence from Doppler ultrasound and photoplethysmographic signal analysis. Biomedical Physics & Engineering Express, 12, 055065. Published 22 October 2026.',[E('link','Published article','DOI: 10.1088/2057-1976/aeb382','https://doi.org/10.1088/2057-1976/aeb382'),E('doc','Published paper PDF','Access-controlled copy of the published article; access is granted individually after request and identity verification',null,'private')]),
  H('Author contribution','Listed as the third author. The published CRediT statement attributes supporting contributions in data curation, formal analysis, methodology and validation.',[E('doc','Author contribution statement','Access-controlled published contribution statement; access is granted individually after request and identity verification',null,'private')]),
  H('Study design','Twenty healthy volunteers underwent 10 Hz PEMF exposure over the brachial artery in two opposing coil orientations. Downstream responses were assessed using radial artery Doppler ultrasound and index-finger PPG.',[E('doc','Methods and protocol','Access-controlled methods section from the published article; access is granted individually after request and identity verification',null,'private')]),
  H('Analysis and findings','Participant-level features were assessed with paired Wilcoxon signed-rank tests, Benjamini-Hochberg false-discovery-rate correction and descriptive KDE-L1 analysis. Direct Forward-Reverse comparison identified significant differences in eight PPG features, while Doppler showed a more selective response.',[E('doc','Results and analysis','Access-controlled results from the published article; access is granted individually after request and identity verification',null,'private'),E('photo','Measurement plot','Add a shareable Doppler or PPG result figure')]),
  H('Research significance','The findings support induced electric-field orientation relative to the arterial axis and physiological flow direction as a potentially relevant exposure parameter in vascular PEMF research.',[E('link','Journal article','View the peer-reviewed publication','https://doi.org/10.1088/2057-1976/aeb382')])]},

  H('ICAP 2025','International Conference on Advances in Physics. Simulation-Based Investigation of PEMF Effects on Hemodynamics via Physics-Informed Modeling.',[E('photo','Presentation photo','Add a photo'),E('doc','Certificate or slides','Add a file')]),
  H('ICFS: ITGI 2025','2nd International Conference on Frontiers in Science: Innovation & Technology for Greener Industry. Magnetohydrodynamic Modulation of Peripheral Blood Flow under PEMF: An In-Vitro Model Study.',[E('photo','Presentation photo','Add a photo'),E('doc','Certificate or slides','Add a file')]),
  H('Bangladesh Physical Society 2024','First and corresponding author of the poster “Impacts of PEMF Applications on Photoplethysmography Responses” for the International Conference on Physics 2024. The study analysed PPG responses from 14 healthy participants across four PEMF configurations, extracting time-domain, first- and second-derivative, and power-spectral-density features using MATLAB, Python and Excel.',[E('doc','PEMF and PPG conference poster','Public conference poster · open directly in the portfolio',DOCS.bps2024Poster),E('photo','At the event','Add a photo')]),
  H('Simulation symposium 2026','Presented “Arterial–Peripheral Pulse Propagation Model for Fingertip PPG Signal Generation” at the Symposium on Simulation for Everything at North South University on 12 June 2026. The MATLAB implementation constructs an arterial pulse, applies delay, smoothing and attenuation, models microvascular volume change and converts it into a synthetic optical waveform. I examined preservation of the systolic peak, dicrotic notch and reflected wave, learning how each modelling stage changes pulse morphology. <a href="#projects4">Explore the modelling software</a>.',[E('doc',"NSU arterial-peripheral PPG poster",'Public original document · open directly in the portfolio',DOCS.nsuSimulationPoster)]),
  H('Biophysical Society mini symposium 2025','Co-authored the poster “PPG-Based Assessment of PEMF Influence on Arterial Hemodynamics” for Bridging the Theoretical and Experimental Biophysicists in Bangladesh, held at the University of Barishal on 17 April 2025. The study compared PEMF coil configurations using PPG measurements from 43 arteries and time- and frequency-domain analysis.',[E('doc','PPG and PEMF symposium poster','Public conference poster · open directly in the portfolio',DOCS.barishalPoster),E('photo','At the event','Add a photo')])]}
]},

 {id:'projects5',title:'Multi-Tasking Autonomous Device',sub:'EEE499A & EEE499B · Senior Design / Capstone',when:'2023',sum:'Designed and built a low-cost Arduino-based autonomous platform that combined obstacle avoidance, UV disinfection, vacuum cleaning, fire and gas warning, environmental sensing, biometric authentication and remote surveillance.',tags:['Capstone','Robotics','Embedded systems','System integration'],skillLabel:'Tools, languages & skills',skills:['Arduino Uno','Arduino IDE','C++','Tinkercad','Multisim','MATLAB','AutoCAD','Proteus','LTspice','Adafruit Libraries','Sensor Integration','Hardware Prototyping','System Testing'],hl:[
  H('Capstone recommendation','Abu Obaidah, my EEE499A and EEE499B lecturer, highlighted my Arduino hardware-software integration, circuit design, embedded C++ programming, sensor integration and system optimisation across EEE499A and EEE499B, with Proteus, Multisim and AutoCAD supporting the design work.',[E('doc',"Capstone recommendation letter",'Public original document · open directly in the portfolio',DOCS.capstoneRecommendation)]),
  H('System scope','The five-member capstone team integrated seven functional areas on one mobile platform: obstacle avoidance, UV disinfection with human-motion safety cut-off, vacuum cleaning, fire and gas warning, light and temperature monitoring, fingerprint authentication, and Wi-Fi camera surveillance.',[E('doc','EEE499B capstone report','Public original final capstone report · 57 pages',DOCS.capstoneReport)]),
  H('What I did','Contributed across requirements, planning, system analysis, circuit and component selection, module design, Arduino programming, simulation, hardware integration, troubleshooting, testing, documentation and presentation. Work was coordinated as a team, with modules developed and tested before full-system integration.',[E('doc','Project and research summary','Public summary of the project, methods, tools, outcomes and links',DOCS.projectSummary)]),
  H('Testing and outcome','The prototype used a servo-mounted HC-SR04 sensor for navigation, PIR-based UV shut-off and sensor-triggered alarms. The final report records obstacle detection and collision prevention in about 97% of trials, an approximate BDT 3,000 prototype cost and a projected full-featured cost within BDT 5,000.',[E('doc','EEE499B capstone report','Public evidence of the design, testing, results, costs and source code',DOCS.capstoneReport)]),
  H('What I learned','Developed practical understanding of interdisciplinary system integration, iterative prototyping, power and pin budgeting, safety engineering, repeated simulation and validation, sensor calibration, team coordination and designing around real user needs.',[E('doc','EEE499B capstone report','The report includes dedicated lessons-learned and troubleshooting sections',DOCS.capstoneReport)]),
  H('Reports and project files','The public final EEE499B report documents the capstone outcome. The Drive folder contains the report, presentation and supporting project material for the EEE499A–EEE499B sequence.',[E('doc','EEE499B capstone report','Open the complete original report in the portfolio',DOCS.capstoneReport),E('doc','Project and research summary','Open the public project index and summary',DOCS.projectSummary),E('link','Google Drive capstone folder','Reports, presentation files and supporting material','https://drive.google.com/drive/u/6/folders/1Woq_Qu3vTlZhM-vNYceyIlZkXwrpsVhy')])]},
 {id:'projects6',title:'Direct Research: Multi-Tasking Autonomous Device',sub:'EEE498R · Non-credit capstone and graduation requirement',when:'Summer 2023',sum:'Completed the research, requirements and design-development phase that prepared and de-risked the autonomous-device capstone through literature review, alternative assessment, system planning, simulation, prototyping and testing.',tags:['Direct Research','Robotics','Requirements','Technical research'],skillLabel:'Tools, languages & skills',skills:['Research Planning','Requirements Analysis','Literature Review','System Design','Arduino Uno','Arduino IDE','C++','Tinkercad','Multisim','MATLAB','CAD','Technical Writing','Testing & Validation'],hl:[
  H('Requirement and purpose','EEE498R was the one-semester Direct Research requirement supporting the capstone and BSc completion. The team investigated how a low-cost autonomous platform could combine indoor navigation, UV disinfection, cleaning and hazard monitoring.',[E('doc','EEE498R direct research report','Public original Direct Research report · 43 pages',DOCS.directResearch)]),
  H('What I did','The contribution record documents participation across requirement analysis, planning, system analysis, design, implementation, and testing and development. Recorded contributions were 20%, 40%, 20%, 30%, 30% and 25% respectively across those project phases.',[E('doc','EEE498R direct research report','Public evidence including the individual-contribution table',DOCS.directResearch)]),
  H('Research and engineering method','Reviewed prior autonomous and disinfection systems, compared design alternatives, defined modules and constraints, prepared the work breakdown and cost plan, simulated circuits, wrote Arduino C++ control logic, integrated hardware and evaluated the prototype.',[E('doc','EEE498R direct research report','Full methodology, design alternatives, simulations, implementation and appendices',DOCS.directResearch)]),
  H('What I learned','Strengthened requirements-led design, technical literature review, feasibility assessment, project planning, embedded programming, sensor and actuator integration, iterative testing, safety design, troubleshooting and formal engineering documentation.',[E('doc','EEE498R direct research report','The report includes project lessons, feasibility, limitations and future development',DOCS.directResearch)]),

 {id:'projects7',title:'IR-Based Security Alarm',sub:'EEE311 · Analog Electronics II',when:'BSc coursework',sum:'Designed, simulated, assembled and tested an infrared motion-detection alarm that balanced sensitivity and stability and triggered an audible warning.',tags:['Analogue electronics','IR sensing','Alarm circuit'],skillLabel:'Tools, components & skills',skills:['Multisim','AutoCAD','Adobe Illustrator','555 Timer','Operational Amplifiers','Photodiode','Circuit Design','Breadboarding','Testing & Troubleshooting'],hl:[

  H('Technical implementation','Used an IR LED and photodiode sensing stage with a 555 timer, operational amplifiers, buzzer and supporting passive components. AutoCAD and Adobe Illustrator supported schematics, block diagrams and documentation.',[E('link','Google Drive project folder','Report, demonstration video and supporting files','https://drive.google.com/drive/folders/1DQHmyNuPHywqsI3gvlWSi4Q5wzRAVYrW?usp=sharing')]),

 {id:'projects8',title:'Secure Dynamic User Management and Shopping System',sub:'CSE115L · Programming Language I · SEPS course project',when:'BSc coursework',sum:'Developed a C application combining secure user management, persistent file-based records and a simulated shopping workflow.',tags:['C programming','SEPS','File handling','Dynamic memory'],skillLabel:'Language, tools & skills',skills:['C','Code::Blocks','Structures','malloc / realloc / free','File I/O','Error Handling','Debugging','Problem Solving'],hl:[
  H('What I did','Designed the program structure and implemented dynamic user and shopping operations using C structures, control flow, dynamic memory allocation and persistent file storage.',[E('doc','Project and research summary','Public record of the project scope, language, tools and skills',DOCS.projectSummary)]),
  H('Technical implementation','Used Code::Blocks and C, including struct-based data models, malloc, realloc and free for memory management, and fopen, fprintf, fscanf and fclose for file operations and persistence.',[E('link','Google Drive project folder','Source code and supporting project files','https://drive.google.com/drive/u/6/folders/1zfAEEl-Db5UpYKIRbdzXMEkwQPTrbotb')]),

 {id:'projects9',title:'7-Segment Sequential Display Circuit',sub:'EEE211 · Digital Logic Design',when:'BSc coursework',sum:'Designed and implemented a sequential circuit that repeatedly displayed B, A, C, A on a common-cathode 7-segment display.',tags:['Digital logic','Sequential circuits','Hardware'],skillLabel:'Tools, components & skills',skills:['Logisim','CircuitVerse','J-K Flip-Flops','555 Timer','Logic Gates','7-Segment Display','Circuit Simulation','Hardware Assembly'],hl:[
  H('What I did','Derived the required display sequence, designed the counter and decoding logic, modelled and tested the circuit virtually, then assembled and refined the physical implementation.',[E('doc','Project and research summary','Public record of the project design, role, tools and outcome',DOCS.projectSummary)]),
  H('Technical implementation','Combined J-K flip-flops, logic gates, a 555-timer clock source and a common-cathode display. Logisim and CircuitVerse were used before translating the design into hardware.',[E('link','Google Drive project folder','Circuit files, documentation and demonstration video','https://drive.google.com/drive/folders/1EOPnSh18hJnQ3ZDWEMrTEwmpjwYngOii?usp=sharing')]),

 {id:'projects10',title:'Amplitude Modulation and Demodulation',sub:'EEE422 · Principles of Digital Communications',when:'BSc coursework',sum:'Built a complete MATLAB Simulink model to demonstrate amplitude modulation, demodulation and waveform recovery without physical hardware.',tags:['Communications','MATLAB','Simulink','Signal processing'],skillLabel:'Tools & skills',skills:['MATLAB','Simulink','Waveform Analysis','Signal Processing','Model Optimisation','Microsoft PowerPoint','Technical Presentation'],hl:[
  H('What I did','Designed the simulation blocks, configured the modulation and demodulation chain, executed experiments, extracted waveform data and analysed whether the recovered signal matched the theoretical behaviour.',[E('doc','Project and research summary','Public record of the simulation role, tools, skills and findings',DOCS.projectSummary)]),
  H('Technical implementation','Used MATLAB and Simulink for model construction, signal generation, simulation and waveform analysis, then used PowerPoint to present the method and results.',[E('link','Google Drive project folder','Simulink model, presentation and project files','https://drive.google.com/drive/u/6/folders/1RXqOoQHS_AlfOaL1edo2Vj6ZsMIMSE45')]),
  H('What I learned','Connected AM theory with observable time-domain waveforms, improved simulation debugging and model optimisation, and strengthened technical explanation, teamwork and presentation skills.',[E('doc','Project and research summary','Public summary of the validated modulation and demodulation model',DOCS.projectSummary)])]},
 {id:'projects11',title:'Automatic Surface Disinfecting Device Using UV LEDs',sub:'EEE299 · Junior Design',when:'BSc coursework',sum:'Developed an Arduino-based autonomous disinfection prototype with obstacle avoidance and a motion-triggered UV safety cut-off as the precursor to the later capstone.',tags:['Junior Design','Arduino','UV disinfection','Autonomous device'],skillLabel:'Tools, language & skills',skills:['Arduino Uno','Arduino IDE','C++','Tinkercad','Multisim','Proteus','MATLAB','LTspice','AutoCAD','Adobe Illustrator','Ultrasonic Sensors','PIR Sensors'],hl:[
  H('What I did','Contributed to concept development, system design, component integration, Arduino programming, circuit simulation, physical assembly and functional testing of the autonomous UV-disinfection platform.',[E('doc','Project and research summary','Public record of the project role, methodology, hardware, software and outcome',DOCS.projectSummary)]),
  H('Technical implementation','Integrated UV LEDs, an Arduino Uno, L293D motor driver, DC motors, HC-SR04 ultrasonic sensing and PIR motion detection. The device avoided obstacles and switched the UV source off when human motion was detected.',[E('link','Google Drive project folder','Report and supporting design files','https://drive.google.com/drive/u/6/folders/1zgqDs3EcC6pEgLtTHSV8-RnxxvTsKGHC')]),

 {id:'projects4',title:'PPG Distribution Optimizer',sub:'Python desktop application · Biomedical research software',when:'2026',sum:'I built a desktop application to compare the shape of individual optical pulses and their average with and without PEMF exposure. It overlays competing fits on recorded beats and lets me inspect where the models disagree.',tags:['PPG','Research software','Waveform fitting'],skillLabel:'Languages, libraries and methods',skills:['Python','Tkinter','NumPy','pandas','SciPy','Matplotlib','Signal Processing','Numerical Optimisation'],hl:[
  H('From recordings to an average beat','I built separate data pools for the exposed and control conditions. The app reads beat rows from CSV or Excel, flags outlying samples with the interquartile-range rule, and normalises and resamples usable beats onto a common time axis. Users can inspect individual fits alongside the mean pulse and its spread.',[E('photo','PPG pooling controls in Tkinter','Python · The input panels keep the two recording conditions separate before pooling their beats.',IMAGE_ASSETS.ppgDataPanels),E('photo','Pooled beats and their variation','Python and Matplotlib · Each band shows one standard deviation around the mean recorded pulse for that condition.',IMAGE_ASSETS.ppgMeanBands)]),
  H('Fitting the systolic peak and diastolic shoulder','I fitted a seven-parameter double Gaussian to each beat using bounded nonlinear least squares in SciPy. On the pooled pulse I compared that fit with an eleven-parameter skewed-bell model fitted by a genetic algorithm, the Grey Wolf Optimizer and Adam. I weighted errors by pulse region and penalised misplaced peaks and shoulders. The overlays let me see where fits that agreed at the systolic peak diverged on the falling edge.',[E('photo','Four fits to the same recorded pulse','Python and Matplotlib · The mean PEMF pulse is overlaid with three skewed-bell fits and a double-Gaussian reference fit.',IMAGE_ASSETS.ppgModelFits)]),
  H('Waveform features','I used pulse timing, area and the first and second derivatives (VPG and APG) to compare eight waveform-derived indices, including reflection index and the APG b/a ratio. I kept the derivative peaks and pulse area in waveform units. The app exports the individual measurements and between-condition differences to CSV.',[]),
  H('Independent recordings','I checked the workflow on VitalDB recordings by band-pass filtering a continuous optical trace and segmenting it from trough to trough before fitting. I also built a version that fits a third reference dataset separately, so its beats stay out of the PEMF-versus-control comparison.',[]),
  H('Comparing simulated and recorded pulses','I added controls for vessel radius, blood velocity and the assumed response to exposure. Changing these inputs updates a synthetic PPG trace, which I can overlay on the recorded average and compare using root mean square error. The companion MATLAB simulation generated the exposure series shown here. <a href="#research1">View the radial-artery research</a>.',[E('photo','Synthetic pulse trains across exposure durations','Companion MATLAB simulation · Each coloured line is a generated pulse train under a different exposure assumption.',IMAGE_ASSETS.matlabSyntheticBeats)]),

 {id:'skills2',title:'Programming and scientific computing',sub:'Python, MATLAB and SQL',when:'Core',sum:'I built a Python desktop tool for fitting optical pulse recordings, wrote MATLAB simulations of blood flow and used SQL for ERP analysis. My visualisation tools include Matplotlib, PyVista, VTK and Plotly.',tags:['Python','MATLAB','SQL','SciPy','Matplotlib','Tkinter','GitHub'],hl:[

    return '<button class="tile" data-ev="'+k+'"><span class="thumb">'+preview+'</span><span class="tb"><span class="ty">'+TL[e.t]+state+'</span><span class="tt">'+e.n+'</span><span class="tc">'+e.c+'</span></span></button>';
  }).join('');
  $('#panel').innerHTML='<div class="pin"><p class="eyebrow">Detail</p><h3>'+h.n+'</h3><p class="more">'+h.x+'</p>'+
    (tiles?'<p class="label">Evidence</p><div class="grid">'+tiles+'</div>':'')+'</div>';
}
function setCrumbs(parts){crumbs.innerHTML=parts;}
function route(first){
  var h=location.hash.slice(1);
  if(itemById[h]){
    cur=itemById[h];detail(cur);
    setCrumbs('<button data-go="home">Index</button><i>/</i><button data-go="'+cur.sec.id+'">'+cur.sec.label+'</button><i>/</i><span>'+cur.title+'</span>');
  }else if(secById[h]){
    cur=null;list(secById[h]);
    setCrumbs('<button data-go="home">Index</button><i>/</i><span>'+secById[h].label+'</span>');
  }else{
    cur=null;home();setCrumbs('<span>Index</span>');
  }
  if(!first){window.scrollTo(0,0);stage.focus({preventScroll:true});}
}
window.addEventListener('hashchange',function(){route(false);});

var li=0,lc=[],lastFocus=null,timer=0,pct=0;
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function requestAccessLink(e){
  var subject=encodeURIComponent('Portfolio evidence access request: '+e.n);
  var body=encodeURIComponent('Hello Jubair,\n\nI would like to request access to "'+e.n+'" from your portfolio.\n\nName:\nOrganization:\nEmail address:\nReason for request:\n\nI understand that access is granted individually after identity verification.\n\nThank you.');
  return 'mailto:'+MAIL+'?subject='+subject+'&body='+body;
}

function media(e){
  if(e.t==='photo'&&e.u)return '<div class="media photo-media"><img src="'+e.u+'" alt="'+e.n+'" loading="eager"></div>';
  if(e.t==='video')return '<div class="media"><span class="ph">Placeholder · your clip goes here</span><button class="play" id="lb-play" aria-label="Play placeholder clip">'+svg('play',28)+'</button><div class="track"><i id="lb-bar"></i></div><span class="tm" id="lb-tm">0:00 / 0:42</span></div>';
  if(e.t==='doc'&&e.s==='private')return '<div class="media"><span class="ph">Access-controlled document · approval required</span><div class="private-doc"><div class="sheet"><i></i></div><a class="open" href="'+requestAccessLink(e)+'">Request access</a><span class="access-note">Access is granted individually after the request is reviewed and the requester’s identity is verified.</span></div></div>';
  if(e.t==='doc'&&e.u){var pages=publicDocPages(e);if(pages)return '<div class="media public-doc-media"><span class="ph"><span>Public document · scroll to read '+pages.length+' page'+(pages.length>1?'s':'')+'</span><a class="open" href="'+e.u+'" target="_blank" rel="noopener">Open original PDF</a></span><div class="public-doc-pages">'+pages.map(function(src,k){return '<img src="'+src+'" alt="'+e.n+' · page '+(k+1)+'" loading="'+(k<2?'eager':'lazy')+'">';}).join('')+'</div></div>';}
  if(e.t==='doc')return '<div class="media"><span class="ph">Placeholder · your document goes here</span><div class="sheet"><i></i></div></div>';
  if(e.t==='link')return '<div class="media"><span class="ph">'+(e.u?'Opens in a new tab':'Placeholder · the real link opens in a new tab')+'</span><div class="url">'+e.c+(e.u?'<br><a class="open" href="'+e.u+'" target="_blank" rel="noopener">Open link</a>':'')+'</div></div>';
  return '<div class="media"><span class="ph">Placeholder · your photo fills this frame</span>'+svg('photo',56)+'</div>';
}
function lbRender(){
  var e=lc[li];clearInterval(timer);timer=0;pct=0;
  $('#lb-ty').textContent=TL[e.t];
  $('#lb-n').textContent=(li+1)+' / '+lc.length;
  $('#lb-media').innerHTML=media(e);
  $('#lb-t').textContent=e.n;
  $('#lb-c').textContent=e.c;
  $('#lb-p').hidden=$('#lb-nx').hidden=lc.length<2;
}
function openLb(k,trigger){
  lc=cur.hl[sel].e;li=k;lastFocus=trigger;lbRender();
  lb.hidden=false;document.body.style.overflow='hidden';$('#lb-x').focus();
}
function closeLb(){
  clearInterval(timer);timer=0;lb.hidden=true;document.body.style.overflow='';
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function step(d){li=(li+d+lc.length)%lc.length;lbRender();}
function playToggle(){
  var b=$('#lb-play');
  if(timer){clearInterval(timer);timer=0;b.innerHTML=svg('play',28);return;}
  b.innerHTML=svg('pause',28);
  timer=setInterval(function(){
    pct+=100/420;
    if(pct>=100){pct=100;clearInterval(timer);timer=0;b.innerHTML=svg('play',28);}
    $('#lb-bar').style.width=pct+'%';
    $('#lb-tm').textContent=fmt(pct*0.42)+' / 0:42';
  },100);
}
$('#lb-x').innerHTML=svg('close',18);
$('#lb-p').innerHTML=svg('prev',18);
$('#lb-nx').innerHTML=svg('next',18);

document.addEventListener('click',function(e){
  var t=e.target;
  var cb=t.closest('[data-copy]');
  if(cb){copyMail(cb);return;}
  var g=t.closest('[data-go]');
  if(g){var v=g.dataset.go;if(location.hash.slice(1)===v){route(false);}else{location.hash=v;}return;}
  var hb=t.closest('[data-hl]');
  if(hb&&cur){
    sel=+hb.dataset.hl;
    document.querySelectorAll('.hl').forEach(function(b,k){b.setAttribute('aria-pressed',k===sel);});
    panel();return;
  }
  var ev=t.closest('[data-ev]');
  if(ev&&cur){openLb(+ev.dataset.ev,ev);return;}
  if(t.closest('#lb-play')){playToggle();return;}
  if(t.closest('#lb-x')||t===lb){closeLb();return;}
  if(t.closest('#lb-p')){step(-1);return;}
  if(t.closest('#lb-nx')){step(1);return;}
});
document.addEventListener('keydown',function(e){
  if(lb.hidden)return;
  if(e.key==='Escape'){closeLb();}
  else if(e.key==='ArrowLeft'&&lc.length>1){step(-1);}
  else if(e.key==='ArrowRight'&&lc.length>1){step(1);}
  else if(e.key==='Tab'){
    var f=Array.prototype.filter.call(lb.querySelectorAll('button'),function(b){return !b.hidden;});
    if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

var cv=$('#field'),cx=cv.getContext('2d'),W=0,H=0,pts=[],mx=-9999,my=-9999;
var rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var dpr=Math.min(window.devicePixelRatio||1,2),ACC='111,211,255';
function size(){
  W=window.innerWidth;H=window.innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  var n=Math.round(Math.min(70,W*H/16000));pts=[];
  for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});
}
function frame(){
  cx.clearRect(0,0,W,H);
  for(var i=0;i<pts.length;i++){
    var p=pts[i];
    if(!rm){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
    for(var j=i+1;j<pts.length;j++){
      var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<130){cx.strokeStyle='rgba('+ACC+','+((1-d/130)*.16).toFixed(3)+')';cx.lineWidth=1;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke();}
    }
    var mdx=p.x-mx,mdy=p.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy);
    if(md<170){cx.strokeStyle='rgba('+ACC+','+((1-md/170)*.4).toFixed(3)+')';cx.lineWidth=1;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(mx,my);cx.stroke();}
    cx.fillStyle='rgba('+ACC+',.5)';cx.fillRect(p.x-1,p.y-1,2,2);
  }
  if(!rm&&!document.hidden)requestAnimationFrame(frame);
}
function startField(){size();frame();}
window.addEventListener('resize',function(){size();if(rm)frame();});
window.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;});
window.addEventListener('pointerleave',function(){mx=my=-9999;});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!rm)requestAnimationFrame(frame);});
startField();
route(true);
</script>
